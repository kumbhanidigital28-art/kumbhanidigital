<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Kumbhani Digital Favicon">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="fav-glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon -->
  <polygon
    points="16,1 29,8.5 29,23.5 16,31 3,23.5 3,8.5"
    fill="url(#fav-grad)"
    filter="url(#fav-glow)"
  />

  <!-- Inner hex ring -->
  <polygon
    points="16,4 26,9.7 26,21.3 16,27 6,21.3 6,9.7"
    fill="none"
    stroke="rgba(255,255,255,0.2)"
    stroke-width="0.8"
  />

  <!-- K mark -->
  <rect x="9.5" y="10" width="2.5" height="12" rx="0.8" fill="white"/>
  <polygon points="12,16 19,10 21.5,10 14.5,16" fill="white"/>
  <polygon points="12,16 21.5,22 19,22 12,17.8" fill="white"/>

  <!-- Accent node dot -->
  <circle cx="22" cy="22" r="1.8" fill="#00D4FF"/>
</svg>
